.atlas .atlas-live-verifier .verification-shell{max-width:1280px;margin:auto;padding:55px 6% 70px}
.atlas .atlas-live-verifier .verification-workbench{border:1px solid #dce8fa;border-radius:13px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:white}
.atlas .atlas-live-verifier .verification-input-panel{padding:32px;min-height:340px;display:flex;flex-direction:column}
.atlas .atlas-live-verifier .verification-input-panel+.verification-input-panel{background:#eff6ff;border-left:1px solid #dce8fa}
.atlas .atlas-live-verifier h2{font-size:30px;line-height:1.25;margin:12px 0 25px;font-family:'Manrope',Arial,sans-serif}
.atlas .atlas-live-verifier .section-kicker{color:#3876ce;letter-spacing:1.5px;font-size:9px}
.atlas .atlas-live-verifier label{font-size:12px;margin-bottom:8px}
.atlas .atlas-live-verifier input:not(.sr-only){min-height:50px;font-size:16px;border:1px solid #c7d9f1;border-radius:7px;padding:13px}
.atlas .atlas-live-verifier .verification-file-button{background:#f8fbff;border:1px dashed #8eb5eb;border-radius:8px;padding:23px;text-align:left;display:grid;gap:8px}
.atlas .atlas-live-verifier .verification-file-button span{font-family:'Manrope',Arial,sans-serif;font-size:19px}
.atlas .atlas-live-verifier .verification-file-button small{font-size:11px;color:#617fa5}
.atlas .atlas-live-verifier .verification-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:25px}
.atlas .atlas-live-verifier .verification-actions button{min-height:46px;border:1px solid #c6d9f5;border-radius:7px;padding:12px 17px;font-size:12px;background:white;color:#215ba9}
.atlas .atlas-live-verifier .verification-actions .button-dark{background:#245aea;color:white;border-color:#245aea}
.atlas .atlas-live-verifier .verification-message{padding:20px;font-size:12px;line-height:1.8;border:0;background:transparent}
.atlas .atlas-live-verifier .verification-result{border-radius:12px;overflow:hidden}
.atlas .atlas-live-verifier .verification-result p{color:#b7cde7}
.atlas .atlas-live-verifier .verification-result dl{padding:24px}.atlas .atlas-live-verifier .verification-result dd{font-size:12px}.atlas .atlas-live-verifier .verification-result-actions{font-size:12px;padding:20px}
